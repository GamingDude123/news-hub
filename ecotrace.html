<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EcoTrace • Scan the truth behind the barcode</title>
<!-- lets iOS install this to the home screen as a full-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EcoTrace">
<meta name="theme-color" content="#050d0a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23050d0a'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%233ddc84' stroke-width='13'/%3E%3Ccircle cx='90' cy='90' r='19' fill='%2334e2c4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --text:#eef4f0;--muted:#8fa39a;--dim:#5d6f68;
  --good:#3ddc84;--ok:#ffd24c;--warn:#ff9f43;--bad:#ff5470;
  --a1:#3ddc84;--a2:#34e2c4;
  --bg:#050d0a;--card:#0d1a15;--card2:#122520;--line:#ffffff14;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#000;color:var(--text);
  display:flex;justify-content:center;overflow:hidden;line-height:1.45;-webkit-font-smoothing:antialiased}

.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.phone::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(110% 60% at 10% -5%,#3ddc8422,transparent 60%),
             radial-gradient(110% 60% at 95% 105%,#34e2c41c,transparent 60%)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 18px 108px}
.scroll::-webkit-scrollbar{display:none}

/* ---------- top bar ---------- */
/* env() keeps the header clear of the clock and Dynamic Island once the app
   runs full-screen from the home screen. */
.bar{display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.6px;font-size:1.15rem}
.logo .mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--a1),var(--a2));
  display:grid;place-items:center;font-size:.9rem;color:#04140c}
.grad{background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pts{margin-left:auto;font-size:.78rem;font-weight:800;background:#3ddc8418;border:1px solid #3ddc8440;
  color:#9df3c4;padding:6px 12px;border-radius:999px}
.iconbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#ffffff10;
  color:var(--text);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}

/* ---------- scanner ---------- */
.scan-wrap{flex:1;display:flex;flex-direction:column;padding:0 18px 100px}
.viewfinder{position:relative;flex:1;min-height:230px;margin-top:6px;border-radius:26px;overflow:hidden;
  background:
    repeating-linear-gradient(115deg,#0e1c17 0 26px,#0b1713 26px 52px);
  border:1px solid var(--line);display:grid;place-items:center}
.vf-shelf{position:absolute;inset:0;opacity:.5;
  background:radial-gradient(60% 40% at 50% 30%,#1d3b31,transparent 70%)}
.vf-box{position:relative;width:74%;aspect-ratio:1.35;border-radius:18px}
.vf-box i{position:absolute;width:34px;height:34px;border:3px solid var(--a1);border-radius:6px}
.vf-box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf-box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf-box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf-box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.laser{position:absolute;left:6%;right:6%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--a1),transparent);box-shadow:0 0 18px 2px #3ddc8477;
  top:8%;animation:sweep 2.1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:88%}}
.bars{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:3px;opacity:.35}
.bars span{width:3px;height:52px;background:#cfe;border-radius:1px}
.bars span:nth-child(2n){height:38px;width:6px}
.bars span:nth-child(3n){height:60px;width:2px}
.vf-status{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;font-size:.82rem;font-weight:700;color:#9df3c4;
  text-shadow:0 1px 6px #000c;line-height:1.35}
.vf-status.err{color:#ffc7d1}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.viewfinder.live #cam{display:block}
.viewfinder.live .vf-shelf,.viewfinder.live .bars{display:none}
.viewfinder.live .vf-box i{border-color:#fff;box-shadow:0 0 12px #0009}
.hitflash{position:absolute;inset:0;background:#3ddc84;opacity:0;pointer-events:none}
.hitflash.go{animation:flash .45s ease}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

.scan-btn{margin-top:16px;width:100%;border:0;border-radius:18px;padding:17px;cursor:pointer;
  background:linear-gradient(100deg,var(--a1),var(--a2));color:#04140c;font-family:inherit;font-weight:900;font-size:1.05rem}
.scan-btn:active{transform:scale(.985)}
.scan-btn:disabled{opacity:.55}
.alt-row{display:flex;gap:8px;margin-top:9px}
.alt-row button{flex:1;border:1px solid var(--line);background:#ffffff12;color:var(--text);border-radius:15px;
  padding:13px;font-family:inherit;font-weight:800;font-size:.88rem;cursor:pointer}
.engine{margin-top:9px;font-size:.7rem;font-weight:700;color:var(--dim);text-align:center;letter-spacing:.3px}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  color:var(--text);font-family:inherit;font-size:.95rem;font-weight:600;letter-spacing:1px}
.manual input::placeholder{color:var(--dim);letter-spacing:0}
.manual button{border:1px solid var(--line);background:#ffffff12;color:var(--text);border-radius:14px;
  padding:0 16px;font-family:inherit;font-weight:800;cursor:pointer}
.hint{margin-top:16px;font-size:.74rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.demo-row{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.demo-row::-webkit-scrollbar{display:none}
.demo-chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;
  cursor:pointer;font-family:inherit;color:var(--text);text-align:left}
.demo-chip .dc-e{font-size:1.1rem}
.demo-chip .dc-n{font-size:.82rem;font-weight:800;margin-top:2px}
.demo-chip .dc-b{font-size:.7rem;color:var(--muted);font-weight:600}

/* ---------- score ---------- */
.prod-head{display:flex;gap:14px;align-items:center;margin-top:6px}
.prod-emoji{width:56px;height:56px;flex:0 0 auto;border-radius:16px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:1.7rem}
.prod-name{font-size:1.25rem;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.prod-brand{font-size:.85rem;color:var(--muted);font-weight:600;margin-top:2px}
.prod-code{font-size:.7rem;color:var(--dim);font-weight:700;letter-spacing:1.5px;margin-top:3px}

.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:20px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:18px}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:2.2rem;font-weight:900;letter-spacing:-2px;line-height:1}
.ring .of{font-size:.62rem;font-weight:800;color:var(--dim);letter-spacing:1.5px;margin-top:2px}
.verdict{font-size:1.1rem;font-weight:900;letter-spacing:-.3px}
.verdict-sub{font-size:.88rem;color:var(--muted);font-weight:600;margin-top:6px}

.bars-list{margin-top:14px;display:flex;flex-direction:column;gap:13px}
.mbar-top{display:flex;font-size:.82rem;font-weight:800}
.mbar-top span:last-child{margin-left:auto;color:var(--muted)}
.track{height:7px;border-radius:7px;background:#ffffff12;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:7px;transition:width .9s cubic-bezier(.3,1,.4,1)}
.mbar-note{font-size:.76rem;color:var(--dim);font-weight:600;margin-top:4px}

/* ---------- alert ---------- */
.alert{margin-top:18px;border-radius:20px;padding:16px;border:1px solid;display:flex;gap:12px}
.alert.sev-high{background:#2a0d16;border-color:#ff547055}
.alert.sev-med{background:#2a1d0b;border-color:#ff9f4355}
.alert.sev-low{background:#0f2418;border-color:#3ddc8444}
.alert .ae{font-size:1.3rem;line-height:1}
.alert h4{font-size:.95rem;font-weight:900;letter-spacing:-.2px}
.alert p{font-size:.85rem;color:#d7e5de;font-weight:600;margin-top:5px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:.85rem;
  padding:10px 4px;border-radius:12px;cursor:pointer}
.tab.on{background:#ffffff14;color:var(--text)}
.pane{display:none;margin-top:16px}
.pane.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- x-ray timeline ---------- */
.stage{position:relative;padding-left:42px;padding-bottom:18px}
.stage::before{content:'';position:absolute;left:15px;top:34px;bottom:-4px;width:2px;background:linear-gradient(#ffffff26,#ffffff08)}
.stage:last-child::before{display:none}
.stage .dot{position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:.95rem}
.stage h5{font-size:.98rem;font-weight:900;letter-spacing:-.2px}
.stage .loc{font-size:.83rem;color:var(--muted);font-weight:600;margin-top:2px}
.stage .who{font-size:.83rem;color:#c3d6cd;font-weight:600;margin-top:7px}
.stage .who b{color:#fff;font-weight:800}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:.72rem;font-weight:800;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#ffffff0d;color:#cfe0d8}
.tag.co2{background:#ffffff0d;color:#9df3c4;border-color:#3ddc8433}
.tag.flag{background:#ff547018;color:#ffb3c0;border-color:#ff547044}
.tag.warn{background:#ff9f4318;color:#ffd6ac;border-color:#ff9f4344}

/* ---------- labor cards ---------- */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}
.lcard-top{display:flex;align-items:center;gap:9px}
.pill{font-size:.68rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.pill.high{background:#ff547022;color:#ff8fa3}
.pill.med{background:#ff9f4322;color:#ffc182}
.pill.low{background:#3ddc8422;color:#8ce8b3}
.lcard h5{font-size:.95rem;font-weight:900;margin-top:9px}
.lcard p{font-size:.85rem;color:#c3d6cd;font-weight:600;margin-top:5px}
.src{font-size:.72rem;color:var(--dim);font-weight:700;margin-top:9px}

/* ---------- alternatives ---------- */
.alt{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px;margin-bottom:10px;width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer}
.alt .ae{width:44px;height:44px;flex:0 0 auto;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:1.35rem}
.alt .an{font-size:.95rem;font-weight:900;letter-spacing:-.2px}
.alt .ab{font-size:.78rem;color:var(--muted);font-weight:600}
.alt .as{margin-left:auto;text-align:right;flex:0 0 auto}
.alt .as b{font-size:1.35rem;font-weight:900;letter-spacing:-1px}
.alt .as span{display:block;font-size:.7rem;font-weight:800;color:var(--good)}
.swap{width:100%;margin-top:6px;border:0;border-radius:18px;padding:16px;cursor:pointer;font-family:inherit;
  background:linear-gradient(100deg,var(--a1),var(--a2));color:#04140c;font-weight:900;font-size:.98rem}

/* ---------- history ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.stat b{display:block;font-size:1.75rem;font-weight:900;letter-spacing:-1.5px;line-height:1}
.stat span{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.4px}
.sec-title{font-size:.74rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:24px 0 10px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:9px;width:100%;text-align:left;font-family:inherit;color:var(--text);cursor:pointer}
.hrow .he{font-size:1.3rem}
.hrow .hn{font-size:.9rem;font-weight:800}
.hrow .hb{font-size:.75rem;color:var(--muted);font-weight:600}
.hrow .hs{margin-left:auto;font-size:1.15rem;font-weight:900;letter-spacing:-.8px}
.empty{text-align:center;color:var(--dim);font-weight:700;font-size:.9rem;padding:50px 20px}

/* ---------- bottom nav ---------- */
.nav{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;padding:8px 14px calc(14px + env(safe-area-inset-bottom));
  gap:6px;background:linear-gradient(#0000,#050d0aee 38%);backdrop-filter:blur(12px)}
.nav button{flex:1;border:0;background:transparent;color:var(--dim);font-family:inherit;font-weight:800;font-size:.7rem;
  padding:8px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.3px}
.nav button .ni{font-size:1.2rem;line-height:1}
.nav button.on{color:var(--a1)}

/* ---------- compare ---------- */
.slots{display:flex;align-items:stretch;gap:8px;margin-top:6px}
.slot{flex:1;min-width:0;background:var(--card);border:1px dashed #ffffff26;border-radius:20px;padding:14px 12px;
  cursor:pointer;font-family:inherit;color:var(--text);text-align:center;min-height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.slot.filled{border-style:solid;border-color:var(--line)}
.slot .se{font-size:1.7rem}
.slot .sn{font-size:.86rem;font-weight:900;letter-spacing:-.2px;line-height:1.2}
.slot .sb{font-size:.72rem;color:var(--muted);font-weight:700}
.slot .ss{font-size:1.9rem;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-top:2px}
.slot .ph{font-size:1.6rem;color:var(--dim)}
.slot .pht{font-size:.8rem;font-weight:800;color:var(--muted)}
.vs{align-self:center;font-size:.72rem;font-weight:900;letter-spacing:1px;color:var(--dim);
  background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 9px}
.winner{border-color:#3ddc8455 !important;background:#0f2418}
.cbanner{margin-top:14px;border-radius:20px;padding:15px;background:var(--card);border:1px solid var(--line)}
.cbanner h4{font-size:1rem;font-weight:900;letter-spacing:-.3px}
.cbanner p{font-size:.85rem;color:#c3d6cd;font-weight:600;margin-top:5px}
.cbanner.mismatch{background:#2a1d0b;border-color:#ff9f4355}
.crow{margin-top:15px}
.crow .cl{display:flex;align-items:baseline;font-size:.82rem;font-weight:800}
.crow .cl .mid{flex:1;text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.5px;text-transform:uppercase}
.cbars{display:flex;align-items:center;gap:6px;margin-top:6px}
.cbars .half{flex:1;height:8px;border-radius:8px;background:#ffffff12;overflow:hidden;display:flex}
.cbars .half.l{justify-content:flex-end}
.cbars .half i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.3,1,.4,1)}
.cbars .half.l i{border-radius:8px 0 0 8px}
.cbars .half.r i{border-radius:0 8px 8px 0}
.ctable{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ctr{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);font-size:.85rem;font-weight:800}
.ctr:last-child{border-bottom:0}
.ctr .k{flex:1;text-align:center;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.ctr .a,.ctr .b{width:33%;flex:0 0 auto}
.ctr .b{text-align:right}
.ctr .win{color:var(--good)}
.gap{margin-top:16px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:16px}
.gap .gt{font-size:.72rem;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
.gap h4{font-size:1.05rem;font-weight:900;margin-top:7px;letter-spacing:-.3px}
.gap .gl{font-size:.84rem;font-weight:700;margin-top:11px;color:#c3d6cd}
.gap .gl b{display:block;font-size:.72rem;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.crow2{display:flex;gap:8px;margin-top:16px}
.crow2 button{flex:1;border-radius:16px;padding:14px;font-family:inherit;font-weight:900;font-size:.9rem;cursor:pointer;
  border:1px solid var(--line);background:#ffffff12;color:var(--text)}
.crow2 button.primary{border:0;background:linear-gradient(100deg,var(--a1),var(--a2));color:#04140c}

/* ---------- picker sheet ---------- */
.sheet{position:absolute;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:#000a;backdrop-filter:blur(3px)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:#0b1712;border:1px solid var(--line);
  border-radius:26px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;
  animation:up .28s cubic-bezier(.3,1,.4,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:1.05rem;font-weight:900;letter-spacing:-.3px}
.sheet .sub{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:3px;margin-bottom:14px}
.sheet .cam-opt{width:100%;border:0;border-radius:16px;padding:14px;margin-bottom:14px;cursor:pointer;font-family:inherit;
  background:linear-gradient(100deg,var(--a1),var(--a2));color:#04140c;font-weight:900;font-size:.92rem}

/* ---------- no record ---------- */
.norec{text-align:center;padding:34px 6px}
.norec .ne{font-size:3rem}
.norec h3{font-size:1.3rem;font-weight:900;letter-spacing:-.5px;margin-top:12px}
.norec .code{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:2px;margin-top:6px}
.norec p{font-size:.9rem;color:#c3d6cd;font-weight:600;margin-top:14px;text-align:left}

/* ---------- disclaimer ---------- */
.disc{margin-top:26px;font-size:.72rem;color:var(--dim);font-weight:600;line-height:1.55;
  border-top:1px solid var(--line);padding-top:14px}
.disc b{color:var(--muted)}

/* toast */
.toast{position:absolute;left:18px;right:18px;bottom:86px;z-index:40;background:#0f2418;border:1px solid #3ddc8455;
  color:#c7f7da;font-size:.88rem;font-weight:800;padding:14px 16px;border-radius:16px;text-align:center;
  opacity:0;transform:translateY(12px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ============================================================
   VISUAL REFRESH
   Depth comes from translucent white layers over one background
   rather than flat grey fills, so every surface shares a light
   source. Score colour drives the page, not just the ring.
   ============================================================ */
:root{
  --text:#f2f8f4;--muted:#a4b8ae;--dim:#75897f;
  --bg:#060f0c;
  --s1:rgba(255,255,255,.055);--s2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.10);
  --r:22px;
}
body{background:#030806}
.phone{background:var(--bg)}
.phone::before{
  background:
    radial-gradient(90% 45% at 8% -8%, rgba(61,220,132,.16), transparent 62%),
    radial-gradient(85% 45% at 100% 104%, rgba(52,226,196,.13), transparent 60%),
    radial-gradient(120% 70% at 50% 40%, rgba(255,255,255,.018), transparent 70%)}

/* one card recipe, used everywhere */
.ring-wrap,.stat,.lcard,.alt,.hrow,.ctable,.gap,.cbanner,.demo-chip,.slot,.alert,.manual input{
  background:linear-gradient(180deg,var(--s1),rgba(255,255,255,.022));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 6px 20px rgba(0,0,0,.28);
  border-radius:var(--r)}
.alert{border-radius:20px}
.hrow,.manual input{border-radius:16px}
.demo-chip{border-radius:18px}

/* header + type */
.bar{padding:calc(12px + env(safe-area-inset-top)) 18px 8px}
.logo{font-size:1.22rem;letter-spacing:-.8px}
.logo .mark{width:30px;height:30px;border-radius:10px;font-size:1rem;
  box-shadow:0 5px 16px rgba(61,220,132,.36)}
.pts{background:rgba(61,220,132,.13);border-color:rgba(61,220,132,.32);color:#a9f5cb;
  padding:7px 13px;font-size:.79rem}
.iconbtn{border-radius:13px;background:var(--s1);border-color:var(--line)}
.iconbtn:active{background:var(--s2)}

.prod-name{font-size:1.42rem;letter-spacing:-.85px;line-height:1.12}
.prod-emoji{width:64px;height:64px;border-radius:19px;background:var(--s2);border-color:var(--line)}
.prod-brand{font-size:.88rem;color:var(--muted)}
.prod-code{letter-spacing:1.9px;font-size:.66rem}

/* score hero — the most important number on the page, sized like it */
.ring-wrap{padding:20px 18px;gap:16px;position:relative;overflow:hidden;align-items:center}
.ring-wrap::after{content:'';position:absolute;left:-46px;top:-70px;width:210px;height:210px;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--glow,transparent) 26%,transparent) 0%,transparent 70%)}
.ring{width:106px;height:106px}
.ring svg{width:106px;height:106px}
.ring .num{font-size:2.3rem;letter-spacing:-2.2px}
.ring .of{font-size:.56rem;letter-spacing:1.7px;color:var(--dim)}
.verdict{font-size:1.06rem;letter-spacing:-.45px;line-height:1.2;text-wrap:balance}
.verdict-sub{font-size:.81rem;line-height:1.48;color:var(--muted);margin-top:7px}

/* metric bars */
.bars-list{gap:16px;margin-top:18px}
.mbar-top{font-size:.85rem}
.mbar-top span:last-child{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--text)}
.track{height:9px;border-radius:9px;background:rgba(255,255,255,.075);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.track i{box-shadow:0 0 12px -1px currentColor}
.mbar-note{font-size:.78rem;color:var(--dim);margin-top:6px}

/* tabs */
.tabs{background:rgba(255,255,255,.05);border-color:var(--line);border-radius:17px;padding:5px;gap:4px}
.tab{border-radius:13px;font-size:.87rem;padding:11px 4px;transition:.18s}
.tab.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.09));
  color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}

/* timeline */
.stage .dot{width:36px;height:36px;border-radius:13px;background:var(--s2);border-color:var(--line);font-size:1.02rem}
.stage{padding-left:48px;padding-bottom:22px}
.stage::before{left:17px;top:40px}
.stage h5{font-size:1.02rem;letter-spacing:-.35px}
.stage .who{color:#cbdcd4;line-height:1.5}
.tag{padding:6px 11px;border-radius:10px;font-size:.73rem;background:rgba(255,255,255,.06)}
.tag.co2{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.28)}
.tag.flag{background:rgba(255,84,112,.13);border-color:rgba(255,84,112,.3)}
.tag.warn{background:rgba(255,159,67,.13);border-color:rgba(255,159,67,.3)}

/* lists */
.lcard{padding:17px}
.lcard h5{font-size:1rem;letter-spacing:-.3px}
.lcard p{color:#c6d8d0;line-height:1.55}
.pill{border-radius:8px;letter-spacing:.9px}
.alt{padding:15px;gap:14px}
.alt .ae{width:48px;height:48px;border-radius:15px;background:var(--s2)}
.stat{padding:17px 16px}
.stat b{font-size:1.95rem;letter-spacing:-1.6px}
.stat span{font-size:.71rem;letter-spacing:.7px;color:var(--dim)}
.sec-title{color:var(--dim);letter-spacing:2.2px}

/* buttons */
.scan-btn,.swap,.crow2 button.primary,.sheet .cam-opt{
  box-shadow:0 8px 24px -6px rgba(61,220,132,.5);letter-spacing:-.2px}
.scan-btn{border-radius:19px;padding:18px;font-size:1.06rem}
.alt-row button{background:var(--s1);border-color:var(--line);border-radius:16px}
.alt-row button:active{background:var(--s2)}

/* viewfinder */
.viewfinder{border-radius:28px;border-color:var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 14px 40px rgba(0,0,0,.4)}
.viewfinder::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:28px;
  box-shadow:inset 0 0 70px rgba(0,0,0,.5)}
.vf-status{font-size:.84rem}
.engine{color:var(--dim);font-size:.68rem}

/* bottom nav */
.nav{padding:10px 16px calc(15px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(6,15,12,.92) 42%);backdrop-filter:blur(16px) saturate(1.3)}
.nav button{gap:5px;font-size:.68rem;letter-spacing:.4px;border-radius:14px;padding:7px 0 5px;transition:.18s}
.nav button .ni{font-size:1.22rem}
.nav button.on{background:rgba(61,220,132,.1)}

/* compare */
.slot{border-radius:20px;min-height:142px}
.slot .ss{font-size:2.1rem;letter-spacing:-1.7px}
.vs{background:var(--s2);border-color:var(--line);font-size:.68rem}
.winner{border-color:rgba(61,220,132,.4)!important;
  background:linear-gradient(180deg,rgba(61,220,132,.13),rgba(61,220,132,.05))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 26px -8px rgba(61,220,132,.45)!important}
.cbanner{padding:17px}
.cbanner h4{font-size:1.05rem;letter-spacing:-.4px}
.ctr{padding:14px}
.cbars .half{height:9px;background:rgba(255,255,255,.075)}
.gap{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03))}

.disc{color:var(--dim);border-top-color:var(--line);font-size:.73rem;line-height:1.6}
.empty{color:var(--dim)}
.sheet .panel{background:#0a1512;border-radius:28px 28px 0 0}
</style>
</head>
<body>
<div class="phone">

  <!-- ============ SCAN ============ -->
  <section class="screen on" id="s-scan">
    <div class="bar">
      <div class="logo"><span class="mark">◉</span><span>Eco<span class="grad">Trace</span></span></div>
      <div class="pts" id="ptsScan">0 pts</div>
    </div>
    <div class="scan-wrap">
      <div class="viewfinder" id="viewfinder">
        <video id="cam" playsinline muted></video>
        <div class="vf-shelf"></div>
        <div class="bars" id="vfBars"></div>
        <div class="vf-box"><i></i><i></i><i></i><i></i></div>
        <div class="laser" id="laser"></div>
        <div class="hitflash" id="hitflash"></div>
        <div class="vf-status" id="vfStatus">Camera is off</div>
      </div>

      <button class="scan-btn" id="scanBtn">Open camera</button>

      <div class="alt-row">
        <button id="photoBtn">🖼 Scan from a photo</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
      <canvas id="frame" style="display:none"></canvas>
      <div class="engine" id="engine"></div>

      <div class="manual">
        <input id="codeInput" inputmode="numeric" placeholder="or type a barcode (e.g. 4001724819400)">
        <button id="codeGo">Go</button>
      </div>

      <div class="hint">Try a demo product</div>
      <div class="demo-row" id="demoRow"></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="s-result">
    <div class="bar">
      <button class="iconbtn" id="backBtn">←</button>
      <div class="logo" style="font-size:1rem">Impact report</div>
      <button class="iconbtn" id="toCompare" title="Compare this product" style="margin-left:auto">⇄</button>
      <div class="pts" id="ptsResult">0 pts</div>
    </div>
    <div class="scroll" id="resultScroll"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="screen" id="s-history">
    <div class="bar">
      <div class="logo"><span class="mark">◉</span><span>Your impact</span></div>
      <button class="iconbtn" id="clearBtn" title="Clear history">⌫</button>
    </div>
    <div class="scroll" id="historyScroll"></div>
  </section>

  <!-- ============ COMPARE ============ -->
  <section class="screen" id="s-compare">
    <div class="bar">
      <div class="logo"><span class="mark">⇄</span><span>Head to head</span></div>
      <button class="iconbtn" id="cmpReset" title="Clear both slots">⌫</button>
    </div>
    <div class="scroll" id="compareScroll"></div>
  </section>

  <nav class="nav">
    <button data-go="s-scan" class="on"><span class="ni">◎</span>Scan</button>
    <button data-go="s-compare"><span class="ni">⇄</span>Compare</button>
    <button data-go="s-history"><span class="ni">◈</span>Impact</button>
  </nav>

  <!-- picker sheet -->
  <div class="sheet" id="sheet">
    <div class="scrim" id="sheetScrim"></div>
    <div class="panel">
      <h3 id="sheetTitle">Pick a product</h3>
      <div class="sub" id="sheetSub">Scan a real barcode, or choose from the demo database.</div>
      <button class="cam-opt" id="sheetCam">◎ Scan with camera</button>
      <div id="sheetList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

/* ---------- real camera + barcode decoding ----------
   Two engines. Chrome/Edge get the native BarcodeDetector API. Safari and
   Firefox don't ship it, so those fall back to ZXing compiled to WebAssembly —
   which is what makes this work on an iPhone. */
const ZXING_URL = "https://cdn.jsdelivr.net/npm/zxing-wasm@2/+esm";
const FORMATS = ["EAN-13","EAN-8","UPC-A","UPC-E","Code128","Code39","Code93","Codabar",
                 "ITF","DataBar","DataBarExpanded","QRCode","DataMatrix","Aztec","PDF417"];

let stream=null, detector=null, detectTimer=null, camOn=false;
let engine=null;        // "native" | "wasm"
let zx=null, zxLoading=null;
let pendingSlot=null;   // when the camera was opened from a compare slot

function camMsg(msg, isErr){
  const el=$("#vfStatus");
  el.textContent=msg;
  el.classList.toggle("err", !!isErr);
}
const APP_VERSION = "v8";
function engineMsg(){
  const d = engine==="native" ? "native BarcodeDetector" : engine==="wasm" ? "ZXing (WebAssembly)" : "none";
  $("#engine").textContent = APP_VERSION+" · Decoder: "+d+(zx?" · ready":"");
}

function loadZXing(){
  if(zx) return Promise.resolve(zx);
  if(!zxLoading) zxLoading = import(ZXING_URL).then(m=>(zx=m)).catch(err=>{ zxLoading=null; throw err; });
  return zxLoading;
}

/* Grab a frame to decode. The old version cropped a narrow centre band, which
   silently missed any barcode the user had framed slightly high or low — the
   video is object-fit:cover, so what's on screen and what's in the raw frame
   don't line up. Now we alternate: the whole frame (catches barcodes anywhere,
   and far away), then a centre zoom (catches small or low-contrast ones). */
let zoomTick=false;
function grabFrame(){
  const v=$("#cam"), vw=v.videoWidth, vh=v.videoHeight;
  if(!vw || !vh) return null;
  zoomTick=!zoomTick;
  const f = zoomTick ? 1 : 0.55;                    // full frame, then centre zoom
  const cw=Math.round(vw*f), ch=Math.round(vh*f);
  const sx=Math.round((vw-cw)/2), sy=Math.round((vh-ch)/2);
  const scale=Math.min(1, 1000/cw);
  const cv=$("#frame");
  cv.width=Math.round(cw*scale); cv.height=Math.round(ch*scale);
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(v, sx,sy,cw,ch, 0,0,cv.width,cv.height);
  return ctx.getImageData(0,0,cv.width,cv.height);
}

/* Barcode numbers get mistyped and mis-scanned in predictable ways: the small
   digits printed outside the bars get missed, and UPC-A (12) vs EAN-13 (13)
   differ only by a leading zero. Try the sensible variants before giving up. */
function codeVariants(raw){
  const d = String(raw).replace(/\D/g,"");
  if(!d) return [];
  const out = new Set([d]);
  out.add(d.padStart(12,"0"));
  out.add(d.padStart(13,"0"));
  out.add(d.replace(/^0+/,""));
  if(d.length===12) out.add("0"+d);
  if(d.length===13 && d[0]==="0") out.add(d.slice(1));
  return [...out].filter(c=>c.length>=8 && c.length<=14);
}

function resumeDecoding(){
  engineMsg();
  camMsg("Hold a barcode inside the frame");
  scanStart = Date.now();
  detectTimer = setInterval(detectTick, engine==="native" ? 220 : 300);
}

async function startCamera(){
  if(camOn) return;

  // If we already hold a live stream, reuse it. Calling getUserMedia again is
  // what makes iOS pop the permission prompt a second time.
  if(stream && stream.getVideoTracks().some(t=>t.readyState==="live")){
    stream.getVideoTracks().forEach(t=>t.enabled=true);
    $("#viewfinder").classList.add("live");
    camOn=true;
    $("#scanBtn").textContent="Stop camera";
    try{ await $("#cam").play(); }catch(e){}
    if(!detector && engine==="native"){ engine = zx ? "wasm" : "native"; }
    resumeDecoding();
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    camMsg("This browser exposes no camera API. Type a barcode or pick a demo product below.", true); return;
  }
  camMsg("Requesting camera…");
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
  }catch(err){
    const m = {
      NotAllowedError:"Camera permission was denied. Allow it in the address bar, then tap Open camera again.",
      NotFoundError:"No camera found on this device.",
      NotReadableError:"The camera is already in use by another app.",
      SecurityError:"Camera needs a secure context — open this file over https:// or localhost."
    }[err.name] || ("Couldn't open the camera ("+err.name+").");
    camMsg(m+" You can still type a barcode or pick a demo product.", true);
    return;
  }
  const v=$("#cam");
  v.srcObject=stream;
  try{ await v.play(); }catch(e){}
  $("#viewfinder").classList.add("live");
  camOn=true;
  $("#scanBtn").textContent="Stop camera";

  if("BarcodeDetector" in window){
    try{
      const supported = await window.BarcodeDetector.getSupportedFormats();
      const want = supported.filter(f=>!/unknown/.test(f));
      detector = new window.BarcodeDetector(want.length?{formats:want}:undefined);
      engine="native";
    }catch(e){ detector=null; }
  }

  if(!detector){
    camMsg("Starting the barcode decoder…");
    try{
      await loadZXing();
      engine="wasm";
    }catch(e){
      engine=null; engineMsg();
      camMsg("Camera is live, but the barcode decoder couldn't load — it needs a network connection the first time. Type the number instead.", true);
      return;
    }
  }

  resumeDecoding();
}

/* If nothing has decoded after a while, say something useful instead of
   leaving the user staring at a frame wondering if it's broken. */
let scanStart=0;
const SCAN_TIPS = [
  [7000,  "Still looking — fill more of the frame with the barcode"],
  [14000, "Try more light, and hold the phone steady about 15 cm away"],
  [22000, "Still nothing? Tap 'Scan from a photo' and take a close-up instead"]
];
function scanHint(){
  if(!scanStart) return;
  const t = Date.now()-scanStart;
  for(let i=SCAN_TIPS.length-1;i>=0;i--){
    if(t > SCAN_TIPS[i][0]){ camMsg(SCAN_TIPS[i][1]); return; }
  }
}

/* Pause, don't tear down. The stream stays open so the browser keeps treating
   the permission as granted — stopping every track is what forces a fresh
   prompt next time. The camera indicator stays lit while paused, which is the
   honest trade: the camera really is still held. */
function stopCamera(){
  if(detectTimer){ clearInterval(detectTimer); detectTimer=null; }
  if(stream) stream.getVideoTracks().forEach(t=>t.enabled=false);
  $("#viewfinder").classList.remove("live");
  camOn=false; scanStart=0;
  $("#scanBtn").textContent="Open camera";
  camMsg("Camera is off");
}

/* Full teardown, on the way out of the page. */
function releaseCamera(){
  stopCamera();
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const v=$("#cam"); if(v) v.srcObject=null;
  detector=null;
}
window.addEventListener("pagehide", releaseCamera);

let busy=false;
async function detectTick(){
  if(busy || !camOn) return;
  busy=true;
  try{
    let code="";
    if(engine==="native"){
      const hits = await detector.detect($("#cam"));
      if(hits && hits.length) code = String(hits[0].rawValue||"").trim();
    }else if(engine==="wasm"){
      const img = grabFrame();
      if(img){
        const hits = await zx.readBarcodesFromImageData(img, {formats:FORMATS, tryHarder:true, maxNumberOfSymbols:1});
        if(hits && hits.length && hits[0].isValid !== false) code = String(hits[0].text||"").trim();
      }
    }
    if(code) onDetected(code); else scanHint();
  }catch(e){ /* transient decode misses are normal between frames */ }
  busy=false;
}

/* Photo fallback — covers a denied camera, a laptop with no rear camera, and
   iOS, where tapping this opens the camera roll or the camera directly. */
$("#photoBtn").onclick = ()=>$("#photoInput").click();
$("#photoInput").onchange = async e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value="";
  if(!f) return;
  camMsg("Reading that photo…");
  try{ await loadZXing(); }
  catch(err){ camMsg("The barcode decoder couldn't load — it needs a network connection the first time.", true); return; }
  try{
    const hits = await zx.readBarcodesFromImageFile(f, {formats:FORMATS, tryHarder:true, maxNumberOfSymbols:1});
    const code = hits && hits.length ? String(hits[0].text||"").trim() : "";
    if(code) onDetected(code);
    else camMsg("No barcode found in that photo. Get closer, hold the barcode level, and avoid glare.", true);
  }catch(err){
    camMsg("Couldn't read that image ("+(err.name||"error")+").", true);
  }
};

function onDetected(code){
  const flash=$("#hitflash");
  flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
  if(navigator.vibrate) navigator.vibrate(35);
  stopCamera();
  const slot=pendingSlot; pendingSlot=null;
  if(slot){ fillSlot(slot, code); return; }
  lookup(code);
}

/* ---------- live product data (Open Food Facts) ----------
   Real, open database of ~3M food, drink and cosmetics products, keyed by
   barcode. Where a product has been through Agribalyse it also carries a real
   per-stage carbon breakdown, which is what feeds the X-Ray for live results.
   No API key, CORS-enabled, free. It has no labour data — nobody does — so
   that tab says so plainly rather than inventing findings. */
const OFF_HOSTS = [
  "https://world.openfoodfacts.org",
  "https://world.openbeautyfacts.org",
  "https://world.openproductsfacts.org"
];
const OFF_FIELDS = ["product_name","brands","quantity","image_front_small_url","ecoscore_grade",
  "ecoscore_score","nutriscore_grade","categories_tags","labels_tags","origins","countries",
  "manufacturing_places","packaging","ecoscore_data"].join(",");

/* Real kg CO₂e per kg → a 0-100 bar. Log scale, because footprints span
   0.1 (vegetables) to 60 (beef) and a linear bar would flatten everything. */
const carbonScore = co2 => Math.max(0, Math.min(100, Math.round(100 - 30*Math.log10(co2*10+1))));
const GRADE_TEXT = {a:"Low impact for its category", b:"Below-average impact",
  c:"Average impact", d:"Above-average impact", e:"High impact for its category"};

function pickEmoji(tags){
  const t=(tags||[]).join(" ");
  if(/beverage|drink|water|soda|juice/.test(t)) return "🥤";
  if(/coffee|tea/.test(t)) return "☕";
  if(/dairy|milk|cheese|yogurt/.test(t)) return "🥛";
  if(/meat|beef|pork|chicken|poultry/.test(t)) return "🥩";
  if(/fish|seafood/.test(t)) return "🐟";
  if(/fruit|vegetable|legume/.test(t)) return "🥬";
  if(/bread|cereal|pasta|rice|biscuit|cookie/.test(t)) return "🍞";
  if(/chocolate|candy|sweet|snack|confection/.test(t)) return "🍫";
  if(/cosmetic|beauty|shampoo|soap|hygiene/.test(t)) return "🧴";
  return "🛒";
}

async function fetchLive(code){
  for(const variant of codeVariants(code)){
    for(const host of OFF_HOSTS){
      try{
        const r = await fetch(`${host}/api/v2/product/${encodeURIComponent(variant)}.json?fields=${OFF_FIELDS}`);
        if(!r.ok) continue;
        const j = await r.json();
        if(j && j.status===1 && j.product && (j.product.product_name||j.product.brands)){
          j.product._matched = variant;
          return j.product;
        }
      }catch(e){ /* try the next database */ }
    }
  }
  return null;
}

/* Turn an Open Food Facts record into the same shape the demo products use,
   so the report, compare and history screens all work unchanged. */
function buildFromOFF(code, p){
  const ag  = (p.ecoscore_data && p.ecoscore_data.agribalyse) || {};
  const co2 = typeof ag.co2_total==="number" ? ag.co2_total : null;
  const eco = typeof p.ecoscore_score==="number" ? p.ecoscore_score : null;
  const grade = (p.ecoscore_grade||"").toLowerCase();

  const metrics = [
    {k:"Eco-Score", v:eco,
     note: eco!=null ? (GRADE_TEXT[grade]||"Open Food Facts Eco-Score") : "No Eco-Score published for this product"},
    {k:"Carbon", v: co2!=null ? carbonScore(co2) : null,
     note: co2!=null ? co2.toFixed(2)+" kg CO₂e per kg (Agribalyse)" : "No life-cycle carbon data for this product"},
    {k:"Labor", v:null, note:"No public labour dataset covers individual products"},
    {k:"Circularity", v:null, note: p.packaging ? "Packaging declared: "+p.packaging : "No packaging data"}
  ];

  const stages = [
    ["🌱","Agriculture", ag.co2_agriculture],
    ["🏭","Processing",  ag.co2_processing],
    ["🚚","Transport",   ag.co2_transportation],
    ["📦","Packaging",   ag.co2_packaging],
    ["🏬","Distribution",ag.co2_distribution],
    ["🏠","Use & disposal", ag.co2_consumption]
  ].filter(s=>typeof s[2]==="number" && s[2]>0);

  const chain = stages.map(s=>({
    icon:s[0], stage:s[1],
    loc: co2 ? Math.round(s[2]/co2*100)+"% of this product's footprint" : "",
    who: "Category average from <b>Agribalyse</b>, the French public life-cycle database",
    tags:[{t:s[2].toFixed(2)+" kg CO₂e", c:"co2"}]
  }));

  const declared=[];
  if(p.origins) declared.push({t:"Origin: "+p.origins, c:""});
  if(p.manufacturing_places) declared.push({t:"Made in: "+p.manufacturing_places, c:""});
  if(p.countries) declared.push({t:"Sold in: "+String(p.countries).split(",").slice(0,3).join(", "), c:""});
  (p.labels_tags||[]).slice(0,4).forEach(l=>declared.push({t:l.replace(/^[a-z]{2}:/,"").replace(/-/g," "), c:""}));
  chain.push({
    icon:"🏷️", stage:"What the brand declares",
    loc: declared.length ? "Self-reported, not independently verified" : "Nothing declared",
    who: declared.length ? "Taken from the product label and Open Food Facts contributors"
                         : "This brand publishes no origin or certification data at all",
    tags: declared.length ? declared : [{t:"No disclosure", c:"flag"}]
  });

  const alert = eco==null
    ? {sev:"med", emoji:"❓", title:"Not enough data to score this product",
       text:"Open Food Facts knows this product but has no Eco-Score for it. That usually means nobody has submitted enough ingredient and packaging detail yet — you can add it yourself on openfoodfacts.org."}
    : eco>=60
      ? {sev:"low", emoji:"✅", title:"Eco-Score "+(grade||"").toUpperCase()+" — "+(GRADE_TEXT[grade]||""),
         text:"Scored against other products in the same category using Agribalyse life-cycle data, then adjusted for packaging, origin and certifications."}
      : {sev: eco>=40?"med":"high", emoji:"⚠️", title:"Eco-Score "+(grade||"").toUpperCase()+" — "+(GRADE_TEXT[grade]||""),
         text:"Scored against other products in the same category. The stage breakdown below shows where the footprint actually comes from."};

  return {
    live:true, code,
    emoji: pickEmoji(p.categories_tags),
    img: p.image_front_small_url || null,
    name: p.product_name || "Unnamed product",
    brand: (p.brands||"Unknown brand").split(",")[0].trim(),
    price: p.quantity || "",
    cat: ((p.categories_tags||[])[0]||"").replace(/^[a-z]{2}:/,"").replace(/-/g," ") || "Uncategorised",
    co2: co2!=null ? co2 : "—", co2u:"kg CO₂e per kg", tiers:[declared.length?1:0, 2],
    score: eco,
    metrics, chain, alert,
    labor:[{sev:"med", where:"Every product", title:"No labour data exists for individual products",
      text:"There is no public database mapping a barcode to the working conditions behind it. Certifications like Fairtrade appear above when a brand declares them, but absence of a flag is not evidence of good practice.",
      src:"Open Food Facts carries environmental data only"}],
    alts:[]
  };
}

/* ---------- offline pack ----------
   The most-scanned products from Open Food Facts, shipped with the app so
   common groceries resolve with no network round trip — which matters, since
   supermarkets are exactly where phone signal dies. Anything not in here
   still falls through to the live lookup. */
let PACK=null, packLoading=null;

function loadPack(){
  if(PACK) return Promise.resolve(PACK);
  if(!packLoading){
    packLoading = fetch("pack.json")
      .then(r=>r.ok?r.json():null)
      .then(j=>(PACK=j||{}))
      .catch(()=>(PACK={}));
  }
  return packLoading;
}

function buildFromPack(code, row){
  const [name, brand, score, grade, co2] = row;
  return {
    live:true, packed:true, code,
    emoji:"🛒", img:null,
    name: name || "Unnamed product",
    brand: brand || "Unknown brand",
    price:"",
    cat:"Grocery",
    co2: co2!=null ? co2 : "—", co2u:"kg CO₂e per kg", tiers:[0,2],
    score: typeof score==="number" ? Math.round(score) : null,
    metrics:[
      {k:"Eco-Score", v: typeof score==="number"?Math.round(score):null,
       note: grade ? (GRADE_TEXT[grade]||"Open Food Facts Eco-Score") : "No Eco-Score published"},
      {k:"Carbon", v: co2!=null ? carbonScore(co2) : null,
       note: co2!=null ? co2.toFixed(2)+" kg CO₂e per kg (Agribalyse)" : "No life-cycle carbon data"},
      {k:"Labor", v:null, note:"No public labour dataset covers individual products"},
      {k:"Circularity", v:null, note:"Not in the offline pack — connect to load full detail"}
    ],
    alert: typeof score==="number"
      ? {sev: score>=60?"low":score>=40?"med":"high", emoji: score>=60?"✅":"⚠️",
         title:"Eco-Score "+(grade||"").toUpperCase()+" — "+(GRADE_TEXT[grade]||"scored against its category"),
         text:"Loaded from the offline pack, so this worked without a network connection. Reconnect for the full stage-by-stage breakdown."}
      : {sev:"med", emoji:"❓", title:"Known product, no Eco-Score",
         text:"This product is in the database but nobody has submitted enough detail to score it."},
    chain:[{icon:"📦", stage:"Offline record", loc:"From the bundled pack",
      who:"The full supply-chain breakdown needs a connection",
      tags: co2!=null ? [{t:co2.toFixed(2)+" kg CO₂e per kg", c:"co2"}] : [{t:"No carbon data", c:"warn"}]}],
    labor:[{sev:"med", where:"Unknown", title:"No labour data exists for this product",
      text:"No public dataset connects a barcode to working conditions. This is true of every product, not just this one.",
      src:"Open Food Facts carries environmental data only"}],
    alts:[]
  };
}

/* Second-tier lookup, via our own serverless function. Identifies products
   Open Food Facts has never heard of — electronics, tools, household goods —
   but carries no environmental data, so the report says so rather than
   guessing a score. */
async function fetchFallback(code){
  try{
    const r = await fetch("/api/lookup?code="+encodeURIComponent(code));
    if(!r.ok) return null;
    const j = await r.json();
    return j && j.found ? j : null;
  }catch(e){ return null; }
}

function buildFromFallback(code, d){
  const bits=[];
  if(d.model)  bits.push("Model "+d.model);
  if(d.weight) bits.push(d.weight);
  if(d.priceLow) bits.push("Typically "+(d.currency||"")+d.priceLow);

  return {
    live:true, identifiedOnly:true, code,
    emoji: pickEmoji([d.category||""]),
    img: d.image || null,
    name: d.name || "Unnamed product",
    brand: d.brand || "Unknown brand",
    price: "",
    cat: (d.category||"Uncategorised").split(">").pop().trim(),
    co2:"—", co2u:"no data", tiers:[0,1],
    score: null,
    metrics:[
      {k:"Eco-Score",  v:null, note:"Not assessed — this product is outside the open environmental databases"},
      {k:"Carbon",     v:null, note:"No life-cycle study exists for this product"},
      {k:"Labor",      v:null, note:"No public labour dataset covers individual products"},
      {k:"Circularity",v:null, note:"No packaging or repairability data"}
    ],
    alert:{sev:"med", emoji:"❓", title:"Identified, but not assessed",
      text:"We found what this product is, via "+(d.source||"a product database")+". No open database holds "+
           "environmental or labour data for it — that is true of almost all clothing, electronics and household goods."},
    chain:[{
      icon:"🏷️", stage:"What we know",
      loc: d.category ? d.category.replace(/>/g," → ") : "Category unknown",
      who: d.description ? esc(d.description).slice(0,240) : "<b>"+esc(d.brand||"This brand")+"</b> publishes no supply-chain information",
      tags: bits.length ? bits.map(b=>({t:b, c:""})) : [{t:"No details published", c:"flag"}]
    },{
      icon:"🚫", stage:"What nobody publishes",
      loc:"Every stage before the shelf",
      who:"Where its materials came from, who assembled it, and under what conditions",
      tags:[{t:"Origin unknown", c:"flag"},{t:"Factory unknown", c:"flag"},{t:"Footprint unknown", c:"flag"}]
    }],
    labor:[{sev:"med", where:"Unknown", title:"No labour data exists for this product",
      text:"This product was identified by barcode only. Nothing in any public dataset connects it to a factory, "+
           "a supplier or a set of working conditions. That absence is the norm, not a red flag against this brand specifically.",
      src:"Identified via "+(d.source||"a product database")}],
    alts:[]
  };
}

/* A barcode resolves against the curated demo set first, then the live
   database, then honestly reports a miss. */
async function lookup(code){
  if(camOn) stopCamera();
  if(DB[code]){ showResult(code); return; }

  showLoading(code);

  // Online, the live record is richer (photo, per-stage carbon), so try it first.
  if(navigator.onLine !== false){
    const p = await fetchLive(code);
    if(p){
      DB[code] = buildFromOFF(code, p);      // runtime only, never saved to disk
      showResult(code);
      return;
    }
  }

  // Offline, or the live database was down or had no record: use the pack.
  setLoadingNote("Checking the offline pack…");
  const pack = await loadPack();
  if(pack && pack[code]){
    DB[code] = buildFromPack(code, pack[code]);
    showResult(code);
    return;
  }

  if(navigator.onLine !== false){
    setLoadingNote("Not in the food databases — checking product catalogues…");
    const d = await fetchFallback(code);
    if(d){
      DB[code] = buildFromFallback(code, d);
      showResult(code);
      return;
    }
  }

  showNoRecord(code);
}

function setLoadingNote(msg){
  const el=$("#loadNote"); if(el) el.textContent=msg;
}

function showLoading(code){
  currentCode=null;
  $("#resultScroll").innerHTML = `
    <div class="norec">
      <div class="ne">🔎</div>
      <h3>Looking this up…</h3>
      <div class="code">${esc(code)}</div>
      <p style="text-align:center" id="loadNote">Checking Open Food Facts for a real record.</p>
    </div>`;
  go("s-result");
  $("#resultScroll").scrollTop=0;
}

function showNoRecord(code){
  currentCode=null;
  $("#resultScroll").innerHTML = `
    <div class="norec">
      <div class="ne">🔍</div>
      <h3>No record for this barcode</h3>
      <div class="code">${esc(code)}</div>
      ${ String(code).replace(/\D/g,"").length < 12 ? `<p style="color:#ffc7d1"><b>This code looks too short.</b>
      Shop barcodes have 12 or 13 digits, and this one has ${String(code).replace(/\D/g,"").length}. If you typed it
      in, check the small digits printed <b>outside</b> the bars — there is usually one on the far left and one
      on the far right, and they are easy to miss.</p>` : "" }
      <p>EcoTrace checked Open Food Facts, Open Beauty Facts and Open Products Facts — none of them has this
      item. Food, drink and cosmetics are well covered. Clothing, electronics and furniture are not in any
      open barcode database, so those will always land here.</p>
      <p>If it is a grocery product, you can add it yourself at <b>openfoodfacts.org</b> — the database is
      built by volunteers, and once it is in there this app will find it.</p>
    </div>
    <a class="swap" style="display:block;text-align:center;text-decoration:none"
       href="https://world.openfoodfacts.org/cgi/product.pl?type=add&code=${encodeURIComponent(code)}"
       target="_blank" rel="noopener">Add this product to Open Food Facts</a>
    <button class="swap" id="noRecDemo"
       style="background:#ffffff12;color:var(--text);margin-top:10px">Browse the demo products instead</button>
    <div class="disc"><b>Prototype.</b> The demo database is invented data about fictional brands.</div>`;
  $("#noRecDemo").onclick = ()=>go("s-scan");
  go("s-result");
  $("#resultScroll").scrollTop=0;
}

/* ---------- result ---------- */
let currentCode=null;

function showResult(code){
  const p = DB[code];
  if(!p){ toast("Unknown barcode"); return; }
  currentCode = code;

  const R = 48, C = 2*Math.PI*R;
  const col = scoreColor(p.score);

  const metrics = p.metrics.map(m=>`
    <div>
      <div class="mbar-top"><span>${esc(m.k)}</span><span>${m.v==null?"no data":m.v}</span></div>
      <div class="track"><i data-w="${m.v==null?0:m.v}" style="background:${scoreColor(m.v)}"></i></div>
      <div class="mbar-note">${esc(m.note)}</div>
    </div>`).join("");

  const chain = p.chain.map(s=>`
    <div class="stage">
      <div class="dot">${s.icon}</div>
      <h5>${esc(s.stage)}</h5>
      <div class="loc">${esc(s.loc)}</div>
      <div class="who">${s.who}</div>
      <div class="tagrow">${s.tags.map(t=>`<span class="tag ${t.c}">${esc(t.t)}</span>`).join("")}</div>
    </div>`).join("");

  const labor = p.labor.map(l=>`
    <div class="lcard">
      <div class="lcard-top">
        <span class="pill ${l.sev}">${l.sev==="high"?"High risk":l.sev==="med"?"Medium risk":"Cleared"}</span>
        <span class="ab" style="font-size:.78rem;color:var(--muted);font-weight:700">${esc(l.where)}</span>
      </div>
      <h5>${esc(l.title)}</h5>
      <p>${esc(l.text)}</p>
      <div class="src">${esc(l.src)}</div>
    </div>`).join("");

  const alts = p.alts.length ? p.alts.map(a=>{
    const q=DB[a], d=q.score-p.score;
    return `<button class="alt" data-alt="${a}">
      <span class="ae">${q.emoji}</span>
      <span>
        <span class="an">${esc(q.name)}</span>
        <span class="ab">${esc(q.brand)} · ${esc(q.price)}</span>
      </span>
      <span class="as"><b style="color:${scoreColor(q.score)}">${q.score}</b><span>+${d} better</span></span>
    </button>`;
  }).join("") + `<button class="swap" id="swapBtn">I picked the better option → +${p.alts.length?Math.max(...p.alts.map(a=>DB[a].score-p.score)):0} pts</button>`
   : `<div class="empty">This is already the strongest option we have data for in its category.</div>`;

  $("#resultScroll").innerHTML = `
    <div class="prod-head">
      <div class="prod-emoji">${ p.img ? `<img src="${esc(p.img)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:15px">` : p.emoji }</div>
      <div>
        <div class="prod-name">${esc(p.name)}</div>
        <div class="prod-brand">${esc(p.brand)}${p.price?" · "+esc(p.price):""}</div>
        <div class="prod-code">${esc(code)}${p.live?" · LIVE DATA":""}</div>
      </div>
    </div>

    <div class="ring-wrap" style="--glow:${col}">
      <div class="ring">
        <svg width="112" height="112" viewBox="0 0 112 112">
          <circle cx="56" cy="56" r="${R}" fill="none" stroke="#ffffff14" stroke-width="9"/>
          <circle id="ringArc" cx="56" cy="56" r="${R}" fill="none" stroke="${col}" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"
            style="transition:stroke-dashoffset 1s cubic-bezier(.3,1,.4,1)"/>
        </svg>
        <div class="val"><div class="num" style="color:${col}">${p.score==null?"?":p.score}</div><div class="of">OF 100</div></div>
      </div>
      <div>
        <div class="verdict" style="color:${col}">${verdictOf(p.score)}</div>
        <div class="verdict-sub">${ p.live
          ? "Eco-Score from Open Food Facts. Labour data is not published for any product — see the Labor tab."
          : "Nature and human cost, combined across every stage we can see." }</div>
      </div>
    </div>

    <div class="bars-list">${metrics}</div>

    <div class="alert sev-${p.alert.sev}">
      <span class="ae">${p.alert.emoji}</span>
      <div><h4>${esc(p.alert.title)}</h4><p>${esc(p.alert.text)}</p></div>
    </div>

    <div class="tabs">
      <button class="tab on" data-pane="xray">X-Ray</button>
      <button class="tab" data-pane="labor">Labor</button>
      <button class="tab" data-pane="alts">Better</button>
    </div>

    <div class="pane on" id="pane-xray">${chain}</div>
    <div class="pane" id="pane-labor">${labor}</div>
    <div class="pane" id="pane-alts">${alts}</div>

    <div class="disc">${ p.live
      ? `<b>Live data.</b> Name, brand, photo and Eco-Score come from Open Food Facts, an open database
         maintained by volunteers. The per-stage carbon figures come from Agribalyse and are category
         averages, not measurements of this exact item. Nothing here is invented — but nothing here is
         audited either, and the labour tab is empty because that data does not exist publicly.`
      : `<b>Demo record.</b> Every supply-chain record, score and brand on this screen is invented, and the
         brands are fictional. It shows what a full trace could look like if the data existed. Scan a real
         grocery barcode to see genuine data instead.` }
    </div>`;

  // animate
  requestAnimationFrame(()=>{
    const arc=$("#ringArc");
    if(arc) arc.style.strokeDashoffset = C*(1-(p.score==null?0:p.score)/100);
    document.querySelectorAll("#resultScroll .track i").forEach(i=>i.style.width=i.dataset.w+"%");
  });

  // tabs
  $("#resultScroll").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    $("#resultScroll").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
    $("#resultScroll").querySelectorAll(".pane").forEach(pn=>pn.classList.toggle("on",pn.id==="pane-"+t.dataset.pane));
  });

  // alternatives
  $("#resultScroll").querySelectorAll("[data-alt]").forEach(b=>b.onclick=()=>{
    $("#resultScroll").scrollTop=0;
    showResult(b.dataset.alt);
  });
  const swap=$("#swapBtn");
  if(swap) swap.onclick=()=>{
    const best = Math.max(...p.alts.map(a=>DB[a].score-p.score));
    state.pts += best;
    state.swaps = (state.swaps||0)+1;
    state.saved = (state.saved||0)+best;
    save(); paintPts();
    toast("+"+best+" pts · logged as an avoided purchase");
    swap.disabled=true; swap.style.opacity=".5"; swap.textContent="Logged ✓";
  };

  // history
  const prior = state.scans.findIndex(s=>s.code===code);
  if(prior>-1) state.scans.splice(prior,1);
  state.scans.unshift({code, name:p.name, brand:p.brand, emoji:p.emoji, score:p.score, at:Date.now()});
  state.scans = state.scans.slice(0,40);
  if(prior===-1){ state.pts += 5; toast("+5 pts for scanning something new"); }
  save(); paintPts();

  go("s-result");
  $("#resultScroll").scrollTop=0;
}

$("#backBtn").onclick = ()=>go("s-scan");

$("#toCompare").onclick = ()=>{
  if(!currentCode) return go("s-compare");
  // drop this product into the first free slot, then ask for its opponent
  const slot = cmp[0]===currentCode||cmp[1]===currentCode ? -1 : (cmp[0]?(cmp[1]?0:1):0);
  if(slot>-1) cmp[slot]=currentCode;
  go("s-compare");
  if(!cmp[0]||!cmp[1]) openSheet(cmp[0]?1:0);
};

/* ---------- compare ---------- */
let cmp=[null,null];
const flagsIn = p => p.chain.reduce((n,s)=>n+s.tags.filter(t=>t.c==="flag").length,0);

async function fillSlot(slot, code){
  if(!DB[code]){
    toast("Looking up "+code+"…");
    const p = await fetchLive(code);
    if(p) DB[code] = buildFromOFF(code, p);
    else {
      const d = await fetchFallback(code);
      if(d) DB[code] = buildFromFallback(code, d);
    }
  }
  if(!DB[code]){ toast("No record found for "+code); go("s-compare"); renderCompare(); return; }
  cmp[slot]=code;
  go("s-compare");
  renderCompare();
}

function openSheet(slot){
  $("#sheetTitle").textContent = "Product "+(slot===0?"A":"B");
  $("#sheetSub").textContent = "Scan a real barcode, or choose from the demo database.";
  $("#sheetList").innerHTML = Object.keys(DB).map(c=>{
    const p=DB[c];
    return `<button class="hrow" data-pick="${c}">
      <span class="he">${p.emoji}</span>
      <span><span class="hn">${esc(p.name)}</span><br><span class="hb">${esc(p.brand)} · ${esc(p.cat)}</span></span>
      <span class="hs" style="color:${scoreColor(p.score)}">${p.score}</span>
    </button>`;
  }).join("");
  $("#sheetList").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    closeSheet(); fillSlot(slot, b.dataset.pick);
  });
  $("#sheetCam").onclick = ()=>{
    closeSheet();
    pendingSlot = slot;
    go("s-scan");
    camMsg("Scanning for product "+(slot===0?"A":"B")+"…");
    startCamera();
  };
  $("#sheet").classList.add("on");
}
const closeSheet = ()=>$("#sheet").classList.remove("on");
$("#sheetScrim").onclick = closeSheet;

function slotHTML(i){
  const c=cmp[i], p=c&&DB[c];
  if(!p) return `<button class="slot" data-slot="${i}">
      <span class="ph">＋</span><span class="pht">Add product ${i===0?"A":"B"}</span></button>`;
  const win = cmp[0]&&cmp[1] && p.score===Math.max(DB[cmp[0]].score,DB[cmp[1]].score) && DB[cmp[0]].score!==DB[cmp[1]].score;
  return `<button class="slot filled ${win?"winner":""}" data-slot="${i}">
      <span class="se">${p.emoji}</span>
      <span class="sn">${esc(p.name)}</span>
      <span class="sb">${esc(p.brand)}</span>
      <span class="ss" style="color:${scoreColor(p.score)}">${p.score}</span>
    </button>`;
}

function renderCompare(){
  const A=cmp[0]&&DB[cmp[0]], B=cmp[1]&&DB[cmp[1]];
  let body="";

  if(A&&B){
    const d = B.score-A.score;
    const better = d===0 ? null : (d>0?B:A);
    const mismatch = A.cat!==B.cat;

    body += mismatch
      ? `<div class="cbanner mismatch"><h4>⚠️ Different categories</h4>
         <p>${esc(A.cat)} vs ${esc(B.cat)}. The 1–100 scores are still comparable — they're normalised within a
         category — but the raw CO₂e figures below are not.</p></div>`
      : `<div class="cbanner"><h4>${ better ? esc(better.brand)+" scores "+Math.abs(d)+" points higher" : "Dead heat — both score "+A.score }</h4>
         <p>${ better ? "Same category, same job. The gap is the part of the footprint the cheaper option pushes onto someone else." : "Two different routes to the same total cost." }</p></div>`;

    body += A.metrics.map((m,i)=>{
      const bv=B.metrics[i].v, av=m.v;
      return `<div class="crow">
        <div class="cl">
          <span style="color:${av>=bv?"var(--good)":"var(--muted)"}">${av}</span>
          <span class="mid">${esc(m.k)}</span>
          <span style="margin-left:auto;color:${bv>=av?"var(--good)":"var(--muted)"}">${bv}</span>
        </div>
        <div class="cbars">
          <span class="half l"><i data-w="${av}" style="background:${scoreColor(av)}"></i></span>
          <span class="half r"><i data-w="${bv}" style="background:${scoreColor(bv)}"></i></span>
        </div>
      </div>`;
    }).join("");

    const rows = [
      ["Footprint", A.co2, B.co2, A.co2<B.co2?0:B.co2<A.co2?1:-1,
        mismatch? A.co2u.replace("kg CO₂e ","")+" / "+B.co2u.replace("kg CO₂e ","") : A.co2u],
      ["Red flags", flagsIn(A), flagsIn(B), flagsIn(A)<flagsIn(B)?0:flagsIn(B)<flagsIn(A)?1:-1, "stages with an unresolved issue"],
      ["Traced", A.tiers[0]+"/"+A.tiers[1], B.tiers[0]+"/"+B.tiers[1],
        A.tiers[0]/A.tiers[1]>B.tiers[0]/B.tiers[1]?0:B.tiers[0]/B.tiers[1]>A.tiers[0]/A.tiers[1]?1:-1, "supply tiers verified"],
      ["Price", A.price, B.price, -1, "what you pay at the till"]
    ];
    body += `<div class="ctable">` + rows.map(r=>`
      <div class="ctr">
        <span class="a ${r[3]===0?"win":""}">${esc(String(r[1]))}</span>
        <span class="k">${esc(r[0])}<br><span style="text-transform:none;letter-spacing:0;font-weight:600;opacity:.6">${esc(r[4])}</span></span>
        <span class="b ${r[3]===1?"win":""}">${esc(String(r[2]))}</span>
      </div>`).join("") + `</div>`;

    // widest metric gap gets a callout, with both sides' reasoning
    let gi=0, gd=-1;
    A.metrics.forEach((m,i)=>{ const x=Math.abs(m.v-B.metrics[i].v); if(x>gd){ gd=x; gi=i; } });
    body += `<div class="gap">
      <div class="gt">Where the gap opens · ${gd} points</div>
      <h4>${esc(A.metrics[gi].k)}</h4>
      <div class="gl"><b>${esc(A.brand)} — ${A.metrics[gi].v}</b>${esc(A.metrics[gi].note)}</div>
      <div class="gl"><b>${esc(B.brand)} — ${B.metrics[gi].v}</b>${esc(B.metrics[gi].note)}</div>
    </div>`;

    const wi = d>0?1:0;
    body += `<div class="crow2">
      <button id="cmpOpen">Full report ${wi===1?"B":"A"}</button>
      ${ better ? `<button class="primary" id="cmpPick">I'd buy ${wi===1?"B":"A"} → +${Math.abs(d)} pts</button>` : "" }
    </div>`;
  } else {
    body = `<div class="empty">Fill both slots to see them side by side.<br>
      Scan two products on the shelf, or pull them from the demo database.</div>`;
  }

  $("#compareScroll").innerHTML = `
    <div class="slots">${slotHTML(0)}<span class="vs">VS</span>${slotHTML(1)}</div>
    ${body}
    <div class="disc"><b>Prototype.</b> Both products are invented demo records about fictional brands.
    Scores are normalised within a category, so cross-category comparisons rank behaviour, not absolute impact.</div>`;

  $("#compareScroll").querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>openSheet(+b.dataset.slot));

  requestAnimationFrame(()=>{
    document.querySelectorAll("#compareScroll .cbars i").forEach(i=>i.style.width=i.dataset.w+"%");
  });

  const open=$("#cmpOpen");
  if(open) open.onclick=()=>showResult(DB[cmp[1]].score>DB[cmp[0]].score?cmp[1]:cmp[0]);
  const pick=$("#cmpPick");
  if(pick) pick.onclick=()=>{
    const gain=Math.abs(DB[cmp[1]].score-DB[cmp[0]].score);
    state.pts+=gain; state.swaps=(state.swaps||0)+1; save(); paintPts();
    toast("+"+gain+" pts · logged as a better choice");
    pick.disabled=true; pick.style.opacity=".5"; pick.textContent="Logged ✓";
  };
}

$("#cmpReset").onclick = ()=>{ cmp=[null,null]; renderCompare(); toast("Both slots cleared"); };

/* ---------- history ---------- */
function renderHistory(){
  const s = state.scans;
  const avg = s.length ? Math.round(s.reduce((a,b)=>a+b.score,0)/s.length) : 0;
  const flagged = s.filter(x=>x.score<50).length;

  $("#historyScroll").innerHTML = `
    <div class="stat-grid">
      <div class="stat"><b style="color:${scoreColor(avg)}">${avg||"–"}</b><span>AVG BASKET SCORE</span></div>
      <div class="stat"><b>${state.pts}</b><span>IMPACT POINTS</span></div>
      <div class="stat"><b style="color:var(--bad)">${flagged}</b><span>SCANS UNDER 50</span></div>
      <div class="stat"><b style="color:var(--good)">${state.swaps||0}</b><span>BETTER SWAPS</span></div>
    </div>

    <div class="sec-title">Scan history</div>
    ${ s.length ? s.map(x=>`
      <button class="hrow" data-code="${x.code}">
        <span class="he">${x.emoji}</span>
        <span><span class="hn">${esc(x.name)}</span><br><span class="hb">${esc(x.brand)}</span></span>
        <span class="hs" style="color:${scoreColor(x.score)}">${x.score}</span>
      </button>`).join("")
      : `<div class="empty">Nothing scanned yet.<br>Head to the scanner and try a demo product.</div>` }

    <div class="disc">
      <b>Prototype.</b> Scores and supply-chain records are invented demo data about fictional brands.
      History is stored only in this browser.
    </div>`;

  // live products aren't kept on disk, so re-resolve rather than assuming they're in memory
  $("#historyScroll").querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>lookup(b.dataset.code));
}

$("#clearBtn").onclick = ()=>{
  state = {pts:0, scans:[], swaps:0, saved:0};
  save(); paintPts(); renderHistory(); toast("History cleared");
};

paintPts();

// Warm the offline pack so the first scan is instant, and register the worker
// that makes the app usable with no signal. Both are best-effort.
if(location.protocol==="https:"){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
  }
}
setTimeout(()=>loadPack().then(p=>{
  const n = p ? Object.keys(p).length : 0;
  if(n) $("#engine").textContent = APP_VERSION+" · "+n.toLocaleString()+" products offline · "+
    ($("#engine").textContent.split("· ").pop()||"");
}), 1200);

// show which decoder this browser will use, before the camera is even opened
engine = ("BarcodeDetector" in window) ? "native" : "wasm";
engineMsg();
// on iPhone there's no native decoder, so fetch ZXing now rather than making
// the user wait for a download the moment they first point at a barcode
if(engine==="wasm") loadZXing().then(engineMsg).catch(()=>{});
</script>
</body>
</html>
